appId: com.assessmentoperationsmanager.desktop
productName: Assessment Operations Manager
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
  - package.json
asar: true
npmRebuild: false
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
